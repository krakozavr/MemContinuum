[project]
name = "memcontinuum"
version = "0.2.0rc2"
description = "A small, project-agnostic decision-chain memory engine over hand-authored markdown: SQLite FTS5, title + body-excerpt embeddings, and ruling text made retrievable via its own link rows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastembed>=0.8.0",
    "PyYAML>=6.0.3",
]

# No packaging magic: memidx.py and memlint.py are run directly (or via
# repo-init.sh's rendered hook commands), never imported as an installed
# package. This file exists for dependency/metadata declaration only --
# there is no [build-system] / wheel build here to keep in sync.
