name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # One fastembed cache path on every runner (fastembed honours this
  # variable; its default is tempfile.gettempdir()/fastembed_cache, which
  # is not /tmp on macOS). The per-job "Cache fastembed model" steps cache
  # this path. v2 key (TOP-0137 L2 step 5): the engine loads the plain fp32
  # ONNX of BAAI/bge-small-en-v1.5, not fastembed's quantised default.
  FASTEMBED_CACHE_PATH: /tmp/fastembed_cache

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Round 6: tests/test_hooks.py's TestPreEditChainOracleParity
          # class does `git show 0732ac4:hooks/pre-edit-chain.sh` to get
          # the REAL pre-round-5 script (not a reimplementation) as its
          # oracle. actions/checkout@v4 defaults to fetch-depth: 1 (tip
          # commit only) -- 0732ac4 is this checkout's own history (an
          # ancestor of every commit after fix round 5), so a shallow
          # clone never has it and every oracle-parity test skips
          # instead of running (gated by
          # test_hooks._oracle_commit_available(), not an error).
          # fetch-depth: 0 (full history) is the fix; a fixed positive
          # depth would rot the moment one more commit lands and pushes
          # 0732ac4 out of range again.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # requirements.lock (uv pip compile, exact pins + hashes) is what
        # actually ships -- requirements.txt itself uses >= minimums and is
        # not what CI (or scripts/repo-init.sh's bootstrap_venv, which
        # prefers the lock the same way) installs from. Every pin in it
        # carries a binary wheel for both matrix versions on
        # manylinux_2_28 x86_64 (verified by download simulation before
        # this matrix was added), so the same lock serves both legs
        # unchanged.
        run: pip install -r requirements.lock
      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-model-v2-${{ runner.os }}-${{ matrix.python-version || '3.12' }}
      - name: Warm embedding model
        # Downloads through the engine's single construction site exactly
        # what the engine uses, before any test runs, so no test pays (or
        # times out on) the download.
        run: PYTHONPATH= python -c "import memidx; memidx.load_embedding_model()"
      - name: Run unittest suite
        # Same shell step resolves `python` for BOTH the interpreter that
        # just received `pip install -r requirements.lock` and the one
        # tests/test_hooks.py's subprocess-hook tests actually run under
        # (they gate on MEMCONTINUUM_PYTHON being non-empty, then RUN --
        # a hardcoded path here would diverge from whatever
        # actions/setup-python put on PATH and break that gate silently).
        run: |
          MEMCONTINUUM_PYTHON="$(command -v python)" PYTHONPATH= bash tests/check_no_temp_leak.sh python -m unittest discover -s tests

  bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the unittest job's checkout step above: without
          # this, tests/test_hooks.py's TestPreEditChainOracleParity class
          # skips its whole class on every CI run here too (it needs
          # 0732ac4's real blob, which a shallow default clone never has).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-model-v2-${{ runner.os }}-${{ matrix.python-version || '3.12' }}
      - name: Warm embedding model
        # Downloads through the engine's single construction site exactly
        # what the engine uses, before any test runs, so no test pays (or
        # times out on) the download.
        run: PYTHONPATH= python -c "import memidx; memidx.load_embedding_model()"
      - name: Cache bash 3.2 build
        uses: actions/cache@v4
        with:
          path: ~/.cache/bash32
          key: bash32-3.2.57-v1
      - name: Run bash 3.2 verification harness
        # tests/run_bash32.sh builds bash 3.2.57 from source into
        # ~/.cache/bash32 (gcc/make/bison, cached above) and re-runs the
        # shell-driving suites under it. This has been simulated locally in
        # a clean-cache build on this same ubuntu toolchain shape before
        # this workflow was committed, so it is NOT marked continue-on-error.
        run: |
          MEMCONTINUUM_PYTHON="$(command -v python)" bash tests/check_no_temp_leak.sh bash tests/run_bash32.sh

  macos:
    # A real macOS runner, not a Bash-3.2-on-Ubuntu simulation: it exercises
    # the actual BSD toolchain, filesystem, and the bash 3.2.57 Apple still
    # ships at /bin/bash -- none of which the bash32 job above can reach.
    runs-on: macos-latest
    env:
      # The macOS runner has 3 vCPUs: the hooks' hybrid search fallback loads
      # the embedding model inside the pre-edit hook's 2 s budget and is
      # watchdog-killed there. This job is the portability smoke for the
      # hooks' shell; the Linux jobs exercise the hybrid path. Cold-start cost
      # of the vector channel in hooks is a step-7 item (docs/INTERNALS.md,
      # "Code embeddings").
      MEMCONTINUUM_FALLBACK_MODE: fts
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the unittest job's checkout step above.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Every lock pin carries a macOS arm64 wheel for this Python
        # version (verified by download simulation before this job was
        # added) -- no build toolchain required.
        run: pip install -r requirements.lock
      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-model-v2-${{ runner.os }}-${{ matrix.python-version || '3.12' }}
      - name: Warm embedding model
        # Downloads through the engine's single construction site exactly
        # what the engine uses, before any test runs, so no test pays (or
        # times out on) the download.
        run: PYTHONPATH= python -c "import memidx; memidx.load_embedding_model()"
      - name: Run unittest suite
        run: |
          MEMCONTINUUM_PYTHON="$(command -v python)" PYTHONPATH= bash tests/check_no_temp_leak.sh python -m unittest discover -s tests
      - name: Run bash 3.2 verification harness
        # Real macOS /bin/bash is 3.2.57 already -- MC_BASH32 points
        # run_bash32.sh at it directly instead of building one from source.
        run: |
          MEMCONTINUUM_PYTHON="$(command -v python)" MC_BASH32=/bin/bash bash tests/check_no_temp_leak.sh bash tests/run_bash32.sh
